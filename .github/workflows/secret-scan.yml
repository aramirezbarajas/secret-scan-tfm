name: Secret scan

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: examples/demo-repo/.gitleaks.toml

  # El filtrado LLM requiere Ollama en el runner; no es viable en GitHub-hosted.
  # En un pipeline interno, ejecutar tras Gitleaks:
  #   python scripts/filter_fp_with_llm.py --report results/gitleaks_report.json ...
  # Ver docs/MEMORIA.md seccion 7.2.
