[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-triage"
version = "0.1.0"
description = "Post-procesador de informes Gitleaks con LLM local (Ollama)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ángela Ramírez Barajas" }]
keywords = ["gitleaks", "secrets", "llm", "ollama", "devsecops"]
dependencies = [
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
secret-triage = "secret_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
