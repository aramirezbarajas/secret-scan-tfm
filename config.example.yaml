# Copia este archivo a config.yaml y ajusta rutas si cambias la estructura.
# config.yaml puede contener ajustes locales; este ejemplo sí se versiona en Git.

project_root: "."

creddata_root: "./datasets/creddata"
data_dir: "./datasets/creddata/data"
meta_dir: "./datasets/creddata/meta"
path_prefix_in_reports: "data"

results_dir: "./results"
gitleaks_report: "./results/gitleaks_report.json"
evaluation_summary: "./results/evaluation_summary.json"
fp_candidates: "./results/fp_candidates.json"
fp_after_llm: "./results/fp_after_llm.json"

gitleaks:
  command: "gitleaks"
  no_git: true

llm:
  provider: "ollama"
  base_url: "http://localhost:11434"
  model: "llama3.2"
  temperature: 0
  timeout_seconds: 120

dataset:
  name: "CredData"
  source: "https://github.com/Samsung/CredData"
  license: "Ver LICENSE en el repositorio oficial"
